[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cbo"
version = "1.0.0"
description = "Campaign budget optimizer: Bayesian spend-response curves, Thompson-sampling allocation and creative-fatigue scoring, served by Python services on PostgreSQL."
requires-python = ">=3.12"
license = { text = "MIT" }

[project.scripts]
cbo = "cbo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cbo = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: needs PostgreSQL (DATABASE_URL)", "slow: long-running evaluation"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
