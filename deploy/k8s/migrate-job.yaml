# Runs before each rollout (Argo CD sync wave / Helm pre-upgrade hook); migrations take an
# advisory lock, so replicas starting at the same time are also safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: cbo-migrate
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: ghcr.io/manojrevenkar12-web/campaign-budget-optimizer
          args: ["cbo", "migrate"]
          envFrom: [{secretRef: {name: cbo-db}}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
